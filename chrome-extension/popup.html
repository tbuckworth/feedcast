<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 320px; padding: 16px; font-family: system-ui, sans-serif; font-size: 14px; }
    h2 { margin: 0 0 12px; font-size: 16px; }
    .url { word-break: break-all; color: #555; font-size: 12px; margin-bottom: 12px; max-height: 40px; overflow: hidden; }
    label { font-weight: 600; display: block; margin-bottom: 4px; }
    select { width: 100%; padding: 6px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .status { margin-top: 10px; padding: 8px; border-radius: 4px; font-size: 13px; display: none; }
    .status.success { display: block; background: #dcfce7; color: #166534; }
    .status.error { display: block; background: #fef2f2; color: #991b1b; }
    .setup { text-align: center; color: #666; }
    .setup a { color: #2563eb; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Feedcast</h2>
  <div id="content">
    <div class="url" id="url"></div>
    <label for="mode">Mode</label>
    <select id="mode">
      <option value="auto">Auto</option>
      <option value="summarize">Summarize</option>
      <option value="verbatim">Verbatim</option>
    </select>
    <button id="send">Send to Podcast</button>
    <div class="status" id="status"></div>
  </div>
  <div id="setup" class="setup" style="display:none;">
    <p>Configure your Worker URL and token in <a id="openOptions">extension settings</a>.</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
