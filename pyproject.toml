[project]
name = "feedcast"
version = "0.1.0"
description = "A tool that casts RSS feeds to podcast audio"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "feedparser>=6.0.0",
    "anthropic>=0.40.0",
    "kokoro>=0.9.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "soundfile>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
