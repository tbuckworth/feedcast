[project]
name = "feedcast"
version = "0.1.0"
description = "A tool that casts RSS feeds to podcast audio"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "trafilatura>=2.0.0",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
