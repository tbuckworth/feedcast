podcast:
  title: "Feedcast - AI Safety Blog Summaries"
  description: "AI-generated audio summaries of AI safety blog posts"
  author: "Feedcast Bot"
  email: "feedcast@example.com"
  language: "en-us"
  image_url: "https://tbuckworth.github.io/feedcast/artwork.png"
  base_url: "https://tbuckworth.github.io/feedcast"

tts:
  # NOTE: Now using Chatterbox TTS with Derek Perkins voice cloning
  # voice/speed params below are deprecated (kept for backward compatibility)
  voice: "bm_george"
  speed: 1.0

default_prompt: |
  Summarize this AI safety blog post for a PhD student studying AI safety.

  Requirements:
  - Be concise and to the point - no fluff or padding
  - Preserve technical terminology and nuance - do not dumb down
  - Extract the core arguments, key claims, and most important information
  - Focus on what's new, significant, or actionable in the AI safety landscape
  - Use natural spoken English suitable for audio (no bullet points, lists, or formatting)
  - Aim for 2-3 minutes speaking time (~300-450 words)

  The listener already has technical context in ML and AI safety. Give them the headlines and substance, not background explanations.

  - Write out numbers, dates, and percentages in spoken form (e.g., "forty-five percent" not "45%")
  - Spell out abbreviations (e.g., "for example" not "e.g.")

feeds:
  - name: "Zvi Mowshowitz"
    url: "https://podcast.lesswrong.com/users/zvi.rss"
    mode: "summarize"
    prompt: null  # Uses default_prompt

  - name: "Scott Alexander"
    url: "https://www.astralcodexten.com/feed"
    mode: "verbatim"
    prompt: null
    skip_patterns:
      - "^(Hidden )?Open Thread"
      - "^Links [Ff]or \\w+ \\d{4}"
      - "Classifieds"
      - "^Meetups Everywhere"
      - "^Mantic Monday"
      - "^Highlights [Ff]rom [Tt]he [Cc]omments"
      - "^ACX Survey$"
      - "Contest Rules"
      - "^Apply [Ff]or [Aa]n ACX Grant"
      - "Forecasting Contest"

  # LessWrong author feeds
  # URL pattern: https://www.lesswrong.com/feed.xml?view=community-rss&userId=<USER_ID>
  # Find user IDs on their LessWrong profile page source.
  # List authors BEFORE frontpage so deduplication preserves author attribution.

  - name: "Owain Evans"
    url: "https://www.lesswrong.com/feed.xml?view=community-rss&userId=spJZRySQgiKAFTtHp"
    mode: "auto"
    prompt: null

  - name: "Buck Shlegeris"
    url: "https://www.lesswrong.com/feed.xml?view=community-rss&userId=rx7xLaHCh3m7Po385"
    mode: "auto"
    prompt: null

  - name: "Ryan Greenblatt"
    url: "https://www.lesswrong.com/feed.xml?view=community-rss&userId=dfZAq9eZxs4BB4Ji5"
    mode: "auto"
    prompt: null

  - name: "Daniel Kokotajlo"
    url: "https://www.lesswrong.com/feed.xml?view=community-rss&userId=YLFQfGzNdGA4NFcKS"
    mode: "auto"
    prompt: null

  - name: "AI Futures Project"
    url: "https://blog.ai-futures.org/feed"
    mode: "summarize"
    prompt: null

  # The community's own highlights, not the firehose. frontpage-rss carried
  # every post promoted off Personal Blog — 10 to 14 a day, no quality bar —
  # of which the pipeline narrated whichever happened to be newest. Curation
  # is a few posts a week, chosen by the moderators.
  #
  # Note this feed's pubDate is the CURATION date, and curation trails
  # publication by up to several weeks. That is deliberate here: an item is
  # new to us when it is curated, and the email states the real posting date
  # separately (see src/lesswrong.py).
  #
  # Must be AFTER individual authors for correct deduplication.
  - name: "LessWrong Curated"
    url: "https://www.lesswrong.com/feed.xml?view=curated-rss"
    mode: "auto"
    prompt: null

# Posts built on real mathematics are linked in the email rather than narrated —
# even a good spoken explanation is hard to follow without seeing the notation.
# Threshold is LaTeX matches per 1000 words, measured on the markdown source.
# Every written script (summaries, the briefing) is read against its source by
# a second model and corrected once if it misattributes, distorts or invents.
fidelity_check: true

maths_filter:
  enabled: true
  threshold_per_1k: 8.0

news_briefing:
  enabled: true
  lookback_hours: 24
  # The writer picks this many stories from the blurbs, then writes from
  # their full text (capped per article). 0 = old behaviour, blurbs only.
  full_text_stories: 12
  max_article_chars: 6000
  prompt: |
    You are a professional news anchor delivering a concise daily briefing
    for a technically sophisticated audience.

    HARD LIMIT: 700 words maximum (~5 minutes spoken). Do not exceed this.

    Synthesize the following news articles into a tight, focused briefing.
    Cover only the 4-5 most important stories. Skip anything that isn't
    genuinely significant. Ruthlessly prioritize — a shorter, punchier
    briefing is always better than a comprehensive one.

    Structure:
    1. Open with "Here is your daily news briefing for [today's date]."
    2. Cover the most important stories first, grouping related items
    3. For each story: headline fact, one sentence of context, why it matters
    4. Use natural spoken English - no bullet points, lists, or formatting
    5. Close with one sentence of forward look

    Prioritize: AI safety/policy > AI capabilities > geopolitics > economics > markets.
    Be factual. Attribute major claims to their source. Skip trivial or redundant articles.
    Use only what the articles below say. Do not add names, numbers, quotes or
    background from memory: if an article does not say it, the briefing does not either.
    Write out numbers, dates, and percentages in spoken form (e.g., "forty-five percent" not "45%").
    Spell out abbreviations (e.g., "for example" not "e.g.").

  sources:
    - { name: "BBC World", url: "https://feeds.bbci.co.uk/news/world/rss.xml", category: "geopolitics" }
    - { name: "Guardian World", url: "https://www.theguardian.com/world/rss", category: "geopolitics" }
    - { name: "Guardian Business", url: "https://www.theguardian.com/business/rss", category: "economics" }
    - { name: "Ars Technica", url: "https://feeds.arstechnica.com/arstechnica/index", category: "technology" }
    - { name: "TechCrunch", url: "https://techcrunch.com/feed/", category: "technology" }
    - { name: "The Verge AI", url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml", category: "ai_news" }
    - { name: "VentureBeat AI", url: "https://venturebeat.com/category/ai/feed/", category: "ai_news" }
    - { name: "Alignment Forum", url: "https://www.alignmentforum.org/feed.xml?view=frontpage-rss", category: "ai_safety" }
    - { name: "OpenAI Blog", url: "https://openai.com/blog/rss.xml", category: "ai_labs" }
    - { name: "Import AI", url: "https://jack-clark.net/feed/", category: "ai_labs" }
