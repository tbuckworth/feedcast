podcast:
  title: "Feedcast - AI Safety Blog Summaries"
  description: "AI-generated audio summaries of AI safety blog posts"
  author: "Feedcast Bot"
  email: "feedcast@example.com"
  language: "en-us"
  image_url: ""
  base_url: "https://tbuckworth.github.io/feedcast"

tts:
  # NOTE: Now using Chatterbox TTS with Derek Perkins voice cloning
  # voice/speed params below are deprecated (kept for backward compatibility)
  voice: "bm_george"
  speed: 1.0

default_prompt: |
  Summarize this AI safety blog post for a PhD student studying AI safety.

  Requirements:
  - Be concise and to the point - no fluff or padding
  - Preserve technical terminology and nuance - do not dumb down
  - Extract the core arguments, key claims, and most important information
  - Focus on what's new, significant, or actionable in the AI safety landscape
  - Use natural spoken English suitable for audio (no bullet points, lists, or formatting)
  - Aim for 2-3 minutes speaking time (~300-450 words)

  The listener already has technical context in ML and AI safety. Give them the headlines and substance, not background explanations.

feeds:
  - name: "Zvi Mowshowitz"
    url: "https://podcast.lesswrong.com/users/zvi.rss"
    mode: "summarize"
    prompt: null  # Uses default_prompt

  - name: "Scott Alexander"
    url: "https://www.astralcodexten.com/feed"
    mode: "verbatim"
    prompt: null

  # LessWrong author feeds
  # URL pattern: https://www.lesswrong.com/feed.xml?view=community-rss&userId=<USER_ID>
  # Find user IDs on their LessWrong profile page source.
  # List authors BEFORE frontpage so deduplication preserves author attribution.

  - name: "Owain Evans"
    url: "https://www.lesswrong.com/feed.xml?view=community-rss&userId=spJZRySQgiKAFTtHp"
    mode: "auto"
    prompt: null

  - name: "Buck Shlegeris"
    url: "https://www.lesswrong.com/feed.xml?view=community-rss&userId=rx7xLaHCh3m7Po385"
    mode: "auto"
    prompt: null

  - name: "Ryan Greenblatt"
    url: "https://www.lesswrong.com/feed.xml?view=community-rss&userId=dfZAq9eZxs4BB4Ji5"
    mode: "auto"
    prompt: null

  - name: "Daniel Kokotajlo"
    url: "https://www.lesswrong.com/feed.xml?view=community-rss&userId=YLFQfGzNdGA4NFcKS"
    mode: "auto"
    prompt: null

  # Aggregate feed — catches high-karma posts from any author.
  # Must be AFTER individual authors for correct deduplication.
  - name: "LessWrong Frontpage"
    url: "https://www.lesswrong.com/feed.xml?view=frontpage-rss"
    mode: "auto"
    prompt: null
