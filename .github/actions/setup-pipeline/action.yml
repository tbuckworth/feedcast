name: Set up the pipeline
description: >-
  Everything a job needs before it runs src.main or a script: main's latest
  commit, the database and MP3s from the state branch, uv, ffmpeg and the
  Python dependencies. Used by the update, narrate and check-llm jobs in
  update-feed.yml, after actions/checkout (a local action is read from the
  checkout).

# Composite steps take no timeout-minutes, so each command is bounded by
# `timeout`. A hang fails the step (exit 124, and -v names the command it
# stopped) instead of running on to the job's timeout.

inputs:
  pipeline:
    description: >-
      Also pull main, restore the state branch and install ffmpeg. The LLM
      smoke test (check-llm) needs only the Python dependencies.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # A queued run's checkout may be stale, and the narrate job needs the
    # commit the first pass pushed.
    - name: Pull latest main
      if: inputs.pipeline == 'true'
      shell: bash
      run: timeout -v 5m git pull origin main

    - name: Restore database and audio from the state branch
      if: inputs.pipeline == 'true'
      shell: bash
      run: timeout -v 10m scripts/state.sh pull

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    # The packages apt fetches for ffmpeg, kept between runs because the
    # mirror can trickle them too slowly to install (scripts/ci-install-ffmpeg.sh).
    # The key names the runner image, whose package versions it matches; on a
    # new image the previous image's packages are restored, apt fetches only
    # those that changed, and the result is saved under the new key.
    - name: Name the ffmpeg package cache
      if: inputs.pipeline == 'true'
      id: ffmpeg-cache-key
      shell: bash
      run: >-
        timeout 1m bash -c 'echo "path=${RUNNER_TEMP}/ffmpeg-debs" >> "$GITHUB_OUTPUT";
        echo "prefix=ffmpeg-debs-${ImageOS}-" >> "$GITHUB_OUTPUT";
        echo "key=ffmpeg-debs-${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"'

    - name: Restore the ffmpeg packages
      if: inputs.pipeline == 'true'
      id: ffmpeg-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.ffmpeg-cache-key.outputs.path }}
        key: ${{ steps.ffmpeg-cache-key.outputs.key }}
        restore-keys: ${{ steps.ffmpeg-cache-key.outputs.prefix }}

    - name: Install ffmpeg
      if: inputs.pipeline == 'true'
      shell: bash
      env:
        FFMPEG_DEB_CACHE: ${{ steps.ffmpeg-cache-key.outputs.path }}
      run: timeout -v 12m scripts/ci-install-ffmpeg.sh

    - name: Save the ffmpeg packages
      if: inputs.pipeline == 'true' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.ffmpeg-cache-key.outputs.path }}
        key: ${{ steps.ffmpeg-cache-key.outputs.key }}

    - name: Install dependencies
      shell: bash
      run: timeout -v 10m uv sync
