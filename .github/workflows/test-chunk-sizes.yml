name: Test TTS Chunk Sizes

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run chunk size test
        env:
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
        run: uv run python tests/test_chunk_sizes.py

      - name: Upload samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunk-size-samples
          path: data/chunk_size_test/
          if-no-files-found: warn
