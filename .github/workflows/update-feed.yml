name: Update Podcast Feed

on:
  schedule:
    # Off the top of the hour: GitHub's scheduler is most congested at :00 and
    # silently drops fires there (missed entirely 2026-08-27 and 2026-08-28).
    - cron: '43 3 * * *'  # Daily at 03:43 UTC (04:43 BST)
  workflow_dispatch:
    inputs:
      llm_smoke_test:
        description: 'Check live LLM routes on synthetic stories only; no email, audio, state changes, or publishing'
        required: false
        type: boolean
        default: false
      entry_url:
        description: 'Specific entry URL/ID to reprocess (leave empty for normal run)'
        required: false
        type: string
      force_verbatim:
        description: 'Force full verbatim reading (use with entry_url to hear complete post)'
        required: false
        type: boolean
        default: false
      inject_url:
        description: 'Arbitrary URL to extract and process as a new episode'
        required: false
        type: string
      inject_mode:
        description: 'Processing mode for injected URL'
        required: false
        type: choice
        options:
          - auto
          - summarize
          - verbatim
        default: auto
      resend_report:
        description: 'Re-send the last run''s email only — no fetching, no audio, no publishing'
        required: false
        type: boolean
        default: false
      preview_briefing:
        description: 'Write a fresh briefing (with prediction markets) and email it to FEEDCAST_EMAIL_TO only; publishes nothing'
        required: false
        type: boolean
        default: false
      force:
        description: 'Run even if today''s daily run already published'
        required: false
        type: boolean
        default: false
      notify_list:
        description: 'Also email the BCC list. Off by default for anything dispatched by hand — those are dev runs: they publish as normal but email only FEEDCAST_EMAIL_TO, with a [DEV] subject'
        required: false
        type: boolean
        default: false

concurrency:
  group: feedcast-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  # A run the operator asked for by hand: a reprocess, an injection, a resend,
  # a forced run or a preview. The guard never stops one, and it is a dev run
  # (FEEDCAST_TEST_RUN) unless notify_list is ticked. "true" or "false".
  ON_DEMAND: ${{ inputs.entry_url != '' || inputs.inject_url != '' || inputs.resend_report == true || inputs.force == true || inputs.preview_briefing == true }}

jobs:
  check-llm:
    if: inputs.llm_smoke_test == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pipeline
        with:
          pipeline: false
      - name: Check live LLM routes
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python -m scripts.check_llm

  # One publish per UTC day, whichever trigger gets there first.
  #
  # Two triggers race by design: the desktop crontab dispatches at a fixed
  # hour, and GitHub's own schedule is the fallback for a desktop that is off.
  # GitHub delivers `schedule:` hours late under load (11h on 2026-08-27,
  # 12h on 2026-08-28, 7h on 2026-08-29), so "the late one arrives after the
  # early one finished" is the normal case, not the exception — on 2026-08-29
  # both ran and two emails went out. Anything the operator asked for by hand
  # (a reprocess, an injection, a resend, force) is never guarded.
  guard:
    if: inputs.llm_smoke_test != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Has today's daily run already published?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$ON_DEMAND" == "true" ]]; then
            echo "Operator-requested run — not guarded"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today="$(date -u +%Y-%m-%d)"
          # A run counts as "already published" only if its update job actually
          # ran: a guarded run succeeds with that job skipped, and must not
          # itself block tomorrow's retry logic or today's genuine attempt.
          published=0
          for id in $(gh run list --repo "$REPO" --workflow update-feed.yml \
                        --created "$today" --status success --limit 20 \
                        --json databaseId --jq '.[].databaseId'); do
            [[ "$id" == "$RUN_ID" ]] && continue
            concl="$(gh api "/repos/$REPO/actions/runs/$id/jobs" \
                       --jq '.jobs[] | select(.name=="update") | .conclusion')"
            if [[ "$concl" == "success" ]]; then
              echo "Run $id already published today"
              published=1
              break
            fi
          done
          if [[ "$published" == "1" ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      # Posts read out in full that wait for the narrate job (0 skips it).
      deferred: ${{ steps.pipeline.outputs.deferred }}
      # The run's files reached main and the state branch. The job can still
      # fail after this (its report email was not sent), and the publish and
      # the narration go ahead regardless.
      pushed: ${{ steps.commit.outcome == 'success' }}
    # Backstop: normal runs take 12-30 min. Without this the job inherits the
    # 6h GitHub default, so any network stall burns 6h of minutes (2026-08-19).
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-pipeline

      - name: Run pipeline
        id: pipeline
        # A backlog day (a late or skipped fire, so two days of posts at once)
        # overran 50 min mid-TTS and threw the whole run away (2026-08-27).
        timeout-minutes: 90
        env:
          # OpenRouter carries Claude and Gemini; OpenAI direct writes bullets
          # and backs up the writer; Anthropic direct backs up Claude.
          # An unset account is skipped (src/llm.py).
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          REPROCESS_ENTRY: ${{ inputs.entry_url }}
          FORCE_VERBATIM: ${{ inputs.force_verbatim }}
          INJECT_URL: ${{ inputs.inject_url }}
          INJECT_MODE: ${{ inputs.inject_mode }}
          RESEND_REPORT: ${{ inputs.resend_report }}
          PREVIEW_BRIEFING: ${{ inputs.preview_briefing }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Completion email. An unset FEEDCAST_EMAIL_TO turns it off; with it
          # set, a missing SMTP_USER or GMAIL_APP_PASSWORD is a failed send,
          # which fails the job once the run has published.
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FEEDCAST_EMAIL_TO: ${{ secrets.FEEDCAST_EMAIL_TO }}
          FEEDCAST_EMAIL_BCC: ${{ secrets.FEEDCAST_EMAIL_BCC }}
          FEEDCAST_EMAIL_ALWAYS: ${{ vars.FEEDCAST_EMAIL_ALWAYS }}
          FEEDCAST_MAX_AGE_HOURS: ${{ vars.FEEDCAST_MAX_AGE_HOURS }}
          # Dev mode: every run an operator asked for by hand (ON_DEMAND, the
          # set the guard waves through) emails only FEEDCAST_EMAIL_TO, unless
          # they ticked notify_list. The daily run — GitHub's schedule, or the
          # bare dispatch from scripts/cron-backstop.sh — is the only one that
          # reaches the list on its own. Two debugging re-runs on 2026-09-08
          # each emailed everyone, one of them about nothing but a failure.
          FEEDCAST_TEST_RUN: ${{ env.ON_DEMAND == 'true' && inputs.notify_list != true }}
          VOICE_UPLOAD_DELAY_SECONDS: "5"
          # Briefing and summaries now; posts read out in full are cleaned,
          # digested and emailed, then narrated by the narrate job below.
          FEEDCAST_PASS: first
        run: uv run python -m src.main

      - name: Commit and push
        id: commit
        timeout-minutes: 10
        run: scripts/ci-commit-and-push.sh

      # Most failures are reported only in that email, so a run whose email
      # did not go out must not stay green. It has published by now.
      - name: Fail the job if the report email was not sent
        if: steps.pipeline.outputs.report_failed == 'true'
        run: |
          echo "::error::The report email was not sent (see the Run pipeline step); the run published as normal"
          exit 1

  deploy:
    needs: update
    # Whenever the update job pushed, even if it then failed on its email.
    # A preview publishes nothing, so there is nothing to deploy.
    if: ${{ !cancelled() && needs.update.outputs.pushed == 'true' && inputs.preview_briefing != true }}
    uses: ./.github/workflows/publish-pages.yml
    with:
      artifact_name: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write

  # The slow half: posts read out in full, narrated after the briefing and the
  # summaries are already published and emailed. On 2026-09-26 a 113-chunk
  # book review ran into the pipeline timeout and took the day's briefing and
  # summary down with it; here it can only take itself. Runs alongside the
  # first deploy. A failed or timed-out narration still commits, so the
  # attempt count and the episode pages are published, and the post is
  # retried by the next run's narrate job; then the job fails.
  narrate:
    needs: update
    if: ${{ !cancelled() && needs.update.outputs.pushed == 'true' && needs.update.outputs.deferred != '0' && needs.update.outputs.deferred != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-pipeline

      - name: Narrate deferred posts
        id: narration
        timeout-minutes: 80
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          # Mails the operator, and only when a narration fails.
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FEEDCAST_EMAIL_TO: ${{ secrets.FEEDCAST_EMAIL_TO }}
          FEEDCAST_TEST_RUN: ${{ env.ON_DEMAND == 'true' && inputs.notify_list != true }}
          VOICE_UPLOAD_DELAY_SECONDS: "5"
          FEEDCAST_PASS: narrate
        run: uv run python -m src.main

      - name: Commit and push
        timeout-minutes: 10
        run: scripts/ci-commit-and-push.sh "Add narrated episodes"

      # continue-on-error let the commit above publish the attempt; without
      # this a crashed or timed-out narration would leave the run green.
      - name: Fail the job if the narration failed
        if: steps.narration.outcome != 'success'
        run: |
          echo "::error::Narrating the deferred posts failed or timed out (see Narrate deferred posts); the attempt is committed and the next run retries them"
          exit 1

      - name: Fail the job if the report email was not sent
        if: steps.narration.outputs.report_failed == 'true'
        run: |
          echo "::error::The narration's failure email was not sent (see Narrate deferred posts)"
          exit 1

  deploy-narrated:
    needs: [deploy, narrate]
    # Also after a failed narrate job: it commits its attempt count and episode
    # pages before failing. Skipped when narrate was (nothing was deferred).
    if: ${{ !cancelled() && needs.deploy.result == 'success' && (needs.narrate.result == 'success' || needs.narrate.result == 'failure') }}
    uses: ./.github/workflows/publish-pages.yml
    with:
      artifact_name: github-pages-narrated
    permissions:
      contents: read
      pages: write
      id-token: write
