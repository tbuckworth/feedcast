name: Update Podcast Feed

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC
  workflow_dispatch:
    inputs:
      entry_url:
        description: 'Specific entry URL/ID to reprocess (leave empty for normal run)'
        required: false
        type: string
      force_verbatim:
        description: 'Force full verbatim reading (use with entry_url to hear complete post)'
        required: false
        type: boolean
        default: false
      inject_url:
        description: 'Arbitrary URL to extract and process as a new episode'
        required: false
        type: string
      inject_mode:
        description: 'Processing mode for injected URL'
        required: false
        type: choice
        options:
          - auto
          - summarize
          - verbatim
        default: auto

concurrency:
  group: feedcast-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest (queued runs may have stale checkout)
        run: git pull origin main

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: uv sync

      - name: Run pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          REPROCESS_ENTRY: ${{ inputs.entry_url }}
          FORCE_VERBATIM: ${{ inputs.force_verbatim }}
          INJECT_URL: ${{ inputs.inject_url }}
          INJECT_MODE: ${{ inputs.inject_mode }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          VOICE_UPLOAD_DELAY_SECONDS: "5"
          SAVE_DEBUG_WAVS: "false"
        run: uv run python -m src.main

      - name: Upload debug WAVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-wavs
          path: data/audio/debug_wavs/
          if-no-files-found: ignore

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ data/
          git diff --staged --quiet || git commit -m "Update podcast feed"
          # Pull latest — if rebase fails (e.g. binary conflicts), fall back to merge
          if ! git pull --rebase origin main; then
            echo "Rebase failed, falling back to merge..."
            git rebase --abort
            git pull --no-rebase origin main -X ours
            git add output/ data/
            git diff --staged --quiet || git commit -m "Update podcast feed (merge)"
          fi
          git push

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # Get latest after update job

      - name: Pull latest changes
        run: git pull origin main

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Copy audio to output
        run: |
          mkdir -p output/audio
          cp data/audio/*.mp3 output/audio/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
