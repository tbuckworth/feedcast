name: Update Podcast Feed

on:
  schedule:
    # Off the top of the hour: GitHub's scheduler is most congested at :00 and
    # silently drops fires there (missed entirely 2026-08-27 and 2026-08-28).
    - cron: '43 3 * * *'  # Daily at 03:43 UTC (04:43 BST)
  workflow_dispatch:
    inputs:
      llm_smoke_test:
        description: 'Check live LLM routes on synthetic stories only; no email, audio, state changes, or publishing'
        required: false
        type: boolean
        default: false
      entry_url:
        description: 'Specific entry URL/ID to reprocess (leave empty for normal run)'
        required: false
        type: string
      force_verbatim:
        description: 'Force full verbatim reading (use with entry_url to hear complete post)'
        required: false
        type: boolean
        default: false
      inject_url:
        description: 'Arbitrary URL to extract and process as a new episode'
        required: false
        type: string
      inject_mode:
        description: 'Processing mode for injected URL'
        required: false
        type: choice
        options:
          - auto
          - summarize
          - verbatim
        default: auto
      resend_report:
        description: 'Re-send the last run''s email only — no fetching, no audio, no publishing'
        required: false
        type: boolean
        default: false
      force:
        description: 'Run even if today''s daily run already published'
        required: false
        type: boolean
        default: false
      notify_list:
        description: 'Also email the BCC list. Off by default for anything dispatched by hand — those are dev runs: they publish as normal but email only FEEDCAST_EMAIL_TO, with a [DEV] subject'
        required: false
        type: boolean
        default: false

concurrency:
  group: feedcast-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check-llm:
    if: inputs.llm_smoke_test == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync
      - name: Check live LLM routes
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python -m scripts.check_llm

  # One publish per UTC day, whichever trigger gets there first.
  #
  # Two triggers race by design: the desktop crontab dispatches at a fixed
  # hour, and GitHub's own schedule is the fallback for a desktop that is off.
  # GitHub delivers `schedule:` hours late under load (11h on 2026-08-27,
  # 12h on 2026-08-28, 7h on 2026-08-29), so "the late one arrives after the
  # early one finished" is the normal case, not the exception — on 2026-08-29
  # both ran and two emails went out. Anything the operator asked for by hand
  # (a reprocess, an injection, a resend, force) is never guarded.
  guard:
    if: inputs.llm_smoke_test != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Has today's daily run already published?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ON_DEMAND: ${{ inputs.entry_url != '' || inputs.inject_url != '' || inputs.resend_report == true || inputs.force == true }}
        run: |
          set -euo pipefail
          if [[ "$ON_DEMAND" == "true" ]]; then
            echo "Operator-requested run — not guarded"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today="$(date -u +%Y-%m-%d)"
          # A run counts as "already published" only if its update job actually
          # ran: a guarded run succeeds with that job skipped, and must not
          # itself block tomorrow's retry logic or today's genuine attempt.
          published=0
          for id in $(gh run list --repo "$REPO" --workflow update-feed.yml \
                        --created "$today" --status success --limit 20 \
                        --json databaseId --jq '.[].databaseId'); do
            [[ "$id" == "$RUN_ID" ]] && continue
            concl="$(gh api "/repos/$REPO/actions/runs/$id/jobs" \
                       --jq '.jobs[] | select(.name=="update") | .conclusion')"
            if [[ "$concl" == "success" ]]; then
              echo "Run $id already published today"
              published=1
              break
            fi
          done
          if [[ "$published" == "1" ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # Backstop: normal runs take 12-30 min. Without this the job inherits the
    # 6h GitHub default, so any network stall burns 6h of minutes (2026-08-19).
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest (queued runs may have stale checkout)
        timeout-minutes: 5
        run: git pull origin main

      - name: Restore database and audio from the state branch
        timeout-minutes: 10
        run: scripts/state.sh pull

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # apt hung here indefinitely on 2026-08-19: the azure.archive.ubuntu.com
      # mirror failed every index (Ign:), the fallback stalled mid-fetch, and
      # apt has no default timeout. Skip apt when ffmpeg is already on the
      # image, and bound + retry it when it isn't.
      - name: Install ffmpeg
        timeout-minutes: 12
        run: |
          set -uo pipefail
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already present: $(ffmpeg -version | head -1)"
            exit 0
          fi
          APT_OPTS=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
            -o Acquire::ForceIPv4=true
          )
          for attempt in 1 2 3; do
            echo "::group::ffmpeg install attempt ${attempt}/3"
            if sudo timeout 90 apt-get update "${APT_OPTS[@]}" \
               && sudo timeout 240 apt-get install -y --no-install-recommends "${APT_OPTS[@]}" ffmpeg; then
              echo "::endgroup::"
              ffmpeg -version | head -1
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt ${attempt} failed or timed out; retrying in 10s"
            sleep 10
          done
          echo "::error::Could not install ffmpeg after 3 attempts"
          exit 1

      - name: Install dependencies
        timeout-minutes: 10
        run: uv sync

      - name: Run pipeline
        # A backlog day (a late or skipped fire, so two days of posts at once)
        # overran 50 min mid-TTS and threw the whole run away (2026-08-27).
        timeout-minutes: 90
        env:
          # OpenRouter carries Claude and Gemini; OpenAI direct writes bullets
          # and backs up the writer; Anthropic direct backs up Claude.
          # An unset account is skipped (src/llm.py).
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          REPROCESS_ENTRY: ${{ inputs.entry_url }}
          FORCE_VERBATIM: ${{ inputs.force_verbatim }}
          INJECT_URL: ${{ inputs.inject_url }}
          INJECT_MODE: ${{ inputs.inject_mode }}
          RESEND_REPORT: ${{ inputs.resend_report }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Completion email. Absent secrets simply skip the report.
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FEEDCAST_EMAIL_TO: ${{ secrets.FEEDCAST_EMAIL_TO }}
          FEEDCAST_EMAIL_BCC: ${{ secrets.FEEDCAST_EMAIL_BCC }}
          FEEDCAST_EMAIL_ALWAYS: ${{ vars.FEEDCAST_EMAIL_ALWAYS }}
          FEEDCAST_MAX_AGE_HOURS: ${{ vars.FEEDCAST_MAX_AGE_HOURS }}
          # Dev mode: every run an operator asked for by hand (the same set the
          # guard waves through) emails only FEEDCAST_EMAIL_TO, unless they
          # ticked notify_list. The daily run — GitHub's schedule, or the bare
          # dispatch from scripts/cron-backstop.sh — is the only one that
          # reaches the list on its own. Two debugging re-runs on 2026-09-08
          # each emailed everyone, one of them about nothing but a failure.
          FEEDCAST_TEST_RUN: ${{ (inputs.entry_url != '' || inputs.inject_url != '' || inputs.resend_report == true || inputs.force == true) && inputs.notify_list != true }}
          VOICE_UPLOAD_DELAY_SECONDS: "5"
          SAVE_DEBUG_WAVS: "false"
        run: uv run python -m src.main

      - name: Upload debug WAVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-wavs
          path: data/audio/debug_wavs/
          if-no-files-found: ignore

      - name: Commit and push
        timeout-minutes: 10
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The database and MP3s are gitignored here; they go to the
          # `state` branch below. Main gets the feed, transcripts and the
          # small per-episode source bundles.
          git add output/ data/sources/
          git diff --staged --quiet || git commit -m "Update podcast feed"
          # Pull latest — if rebase fails (e.g. binary conflicts), fall back to merge
          if ! git pull --rebase origin main; then
            echo "Rebase failed, falling back to merge..."
            git rebase --abort
            git pull --no-rebase origin main -X ours
            git add output/ data/sources/
            git diff --staged --quiet || git commit -m "Update podcast feed (merge)"
          fi
          # State first: if this push lands and the main push fails, the
          # next run regenerates feed.xml from the database anyway. The
          # other order can advertise audio that was never published.
          scripts/state.sh push
          git push

  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # Get latest after update job

      - name: Pull latest changes
        run: git pull origin main

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Copy audio from the state branch to output
        run: |
          scripts/state.sh pull
          mkdir -p output/audio
          cp data/audio/*.mp3 output/audio/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Podcast apps do not poll on our schedule. Pocket Casts fetches feeds
      # server-side and, for a small private feed, only every few hours — so
      # the episode email arrived and the app showed nothing (2026-09-15). It
      # honours WebSub: feed.xml names a hub, and a publish ping here makes the
      # hub fetch the feed and push it to every subscribed app within a minute.
      # The Pages CDN caches for 10 minutes, so wait until the live feed is
      # byte-identical to the one this run committed before pinging, or the
      # hub would fetch and cache the previous day's feed.
      - name: Notify the WebSub hub
        timeout-minutes: 12
        env:
          FEED_URL: https://tbuckworth.github.io/feedcast/feed.xml
        run: |
          set -uo pipefail
          hub="$(grep -o '<atom:link[^>]*rel="hub"[^>]*>' output/feed.xml \
                 | grep -o 'href="[^"]*"' | head -1 | cut -d'"' -f2)"
          if [[ -z "$hub" ]]; then
            echo "feed.xml declares no WebSub hub; nothing to notify"
            exit 0
          fi
          want="$(sha256sum output/feed.xml | cut -d' ' -f1)"
          for attempt in $(seq 1 20); do
            have="$(curl -sSf --max-time 30 -H 'Cache-Control: no-cache' "$FEED_URL" | sha256sum | cut -d' ' -f1)"
            if [[ "$have" == "$want" ]]; then
              echo "Live feed matches the committed feed.xml (attempt ${attempt})"
              break
            fi
            echo "Live feed still differs from the committed feed.xml (attempt ${attempt}/20); waiting 30s"
            sleep 30
          done
          if [[ "$have" != "$want" ]]; then
            echo "::warning::Live feed.xml never matched the committed one; pinging the hub anyway"
          fi
          code="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' -X POST "$hub" \
                    --data-urlencode "hub.mode=publish" --data-urlencode "hub.url=$FEED_URL")"
          if [[ "$code" =~ ^2 ]]; then
            echo "Pinged $hub for $FEED_URL (HTTP $code)"
          else
            echo "::warning::WebSub ping to $hub returned HTTP $code; apps will fall back to polling"
          fi
