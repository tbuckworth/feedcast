name: Publish to GitHub Pages

# Called by update-feed.yml twice a run: once after the first pass (briefing
# and summaries), once after the narration pass (posts read out in full).
# Each call needs its own artifact name, because one workflow run cannot hold
# two artifacts with the same name. The name also carries the attempt: a
# re-run of a failed publish uploads beside the earlier attempt's artifact
# (2026-11-06), and scripts/deploy-pages.sh names the deployment after the
# artifact, which must differ from the cancelled one's (2026-11-10).

on:
  workflow_call:
    inputs:
      artifact_name:
        description: 'Name for this publish''s Pages artifact'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PAGES_ARTIFACT: ${{ inputs.artifact_name }}-attempt-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # Get latest after update job

      - name: Pull latest changes
        run: git pull origin main

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Copy audio from the state branch to output
        run: |
          scripts/state.sh pull
          scripts/publish-audio.sh

      - name: Upload artifact
        id: artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: output

      # In place of actions/deploy-pages, which names every deployment after
      # the run's commit; the script says why that cannot be re-run.
      - name: Deploy to GitHub Pages
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          # Two tries of five minutes: the ten minutes the action allowed one.
          # From 10 Oct to 10 Nov 2026 the slowest of 40 deploys that
          # succeeded took 176 seconds, and most took under 30.
          DEPLOY_ATTEMPTS: 2
          DEPLOY_TIMEOUT_SECONDS: 300
          DEPLOY_POLL_SECONDS: 5
          DEPLOY_RETRY_DELAY_SECONDS: 10
        run: scripts/deploy-pages.sh "$ARTIFACT_ID" "$PAGES_ARTIFACT"

      # Podcast apps do not poll on our schedule. Pocket Casts fetches feeds
      # server-side and, for a small private feed, only every few hours — so
      # the episode email arrived and the app showed nothing (2026-09-15). It
      # honours WebSub: feed.xml names a hub, and a publish ping here makes the
      # hub fetch the feed and push it to every subscribed app within a minute.
      # The Pages CDN caches for 10 minutes, so wait until the live feed is
      # byte-identical to the one this run committed before pinging, or the
      # hub would fetch and cache the previous day's feed. The feed's address
      # and its hub are both read from the feed (src/feed.py writes them).
      - name: Notify the WebSub hub
        timeout-minutes: 12
        run: |
          set -uo pipefail
          # The href of feed.xml's <atom:link rel="$1">; nothing if it has none.
          atom_link() {
            grep -o "<atom:link[^>]*rel=\"$1\"[^>]*>" output/feed.xml \
              | grep -o 'href="[^"]*"' | head -1 | cut -d'"' -f2 || true
          }
          FEED_URL="$(atom_link self)"
          if [[ -z "$FEED_URL" ]]; then
            echo "::error::output/feed.xml has no <atom:link rel=\"self\">, so there is no feed URL to give the hub"
            exit 1
          fi
          hub="$(atom_link hub)"
          if [[ -z "$hub" ]]; then
            echo "feed.xml declares no WebSub hub; nothing to notify"
            exit 0
          fi
          want="$(sha256sum output/feed.xml | cut -d' ' -f1)"
          for attempt in $(seq 1 20); do
            have="$(curl -sSf --max-time 30 -H 'Cache-Control: no-cache' "$FEED_URL" | sha256sum | cut -d' ' -f1)"
            if [[ "$have" == "$want" ]]; then
              echo "Live feed matches the committed feed.xml (attempt ${attempt})"
              break
            fi
            echo "Live feed still differs from the committed feed.xml (attempt ${attempt}/20); waiting 30s"
            sleep 30
          done
          if [[ "$have" != "$want" ]]; then
            echo "::warning::Live feed.xml never matched the committed one; pinging the hub anyway"
          fi
          code="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' -X POST "$hub" \
                    --data-urlencode "hub.mode=publish" --data-urlencode "hub.url=$FEED_URL")"
          if [[ "$code" =~ ^2 ]]; then
            echo "Pinged $hub for $FEED_URL (HTTP $code)"
          else
            echo "::warning::WebSub ping to $hub returned HTTP $code; apps will fall back to polling"
          fi
